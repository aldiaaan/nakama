[workspace]
resolver = "3"
members = [
    "apps/nakama-desktop/src-tauri",
    "crates/nakama-agent",
    "crates/nakama-daemon",
    "crates/nakama-device-info",
    "crates/nakama-settings",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0"
authors = ["aldiaaan <62921668+aldiaaan@users.noreply.github.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"

# Keep Tauri release binaries small. Profiles apply from the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
